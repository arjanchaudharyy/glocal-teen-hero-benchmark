name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: lint, type-check, test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: python -m pip install --upgrade pip ruff mypy

      - name: Ruff (lint)
        run: ruff check gth/ tests/ build.py

      - name: Mypy (type-check)
        run: mypy gth/ build.py

      - name: Rebuild the corpus (build.py must run clean)
        run: python build.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: CLI smoke test
        run: |
          python -m gth --version
          python -m gth rank --top 3
          python -m gth eval
